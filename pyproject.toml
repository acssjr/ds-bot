[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-showdown-bot"
version = "0.2.0"
description = "Observe-only visual foundation for Draft Showdown"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "adbutils>=2.8,<3",
    "customtkinter>=5.2,<6",
    "loguru>=0.7,<1",
    "numpy>=2,<3",
    "opencv-python>=4.10,<5",
    "pillow>=10,<13",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8,<10",
]

[project.scripts]
draft-showdown-bot = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
