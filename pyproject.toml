[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-showdown-bot"
version = "0.2.0"
description = "Observe-first visual foundation with bounded ad recovery for Draft Showdown"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "adbutils>=2.8,<3",
    "customtkinter>=5.2,<6",
    "loguru>=0.7,<1",
    "numpy>=2,<3",
    "onnxruntime>=1.28,<2",
    "opencv-python>=4.10,<5",
    "pillow>=10,<13",
    "pydantic>=2.8,<3",
    "rapidocr>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8,<10",
]

[project.scripts]
draft-showdown-bot = "src.main:main"
draft-showdown-battle = "src.automation.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "assets"]
namespaces = true

[tool.setuptools.package-data]
assets = [
    "templates/*.json",
    "templates/*.png",
    "templates/*.jpg",
    "templates/*.jpeg",
    "templates/**/*.png",
    "templates/**/*.jpg",
    "templates/**/*.jpeg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
